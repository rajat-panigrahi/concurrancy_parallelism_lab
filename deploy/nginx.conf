events { worker_connections 1024; }

http {
    # Plain round-robin: consecutive requests land on different instances. That is what
    # makes the in-process lock visibly fail — two actors on the same account can be
    # served by two replicas holding two unrelated semaphores.
    upstream bank_api {
        server api-1:8080;
        server api-2:8080;
        server api-3:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass         http://bank_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # SignalR needs these to upgrade to WebSockets. Note it ALSO needs sticky
            # sessions and a Redis backplane to work correctly across replicas — see
            # ADR-0009. Round-robin without a backplane means clients miss events, which
            # is the same class of bug as the in-process lock.
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 300s;
        }
    }
}
