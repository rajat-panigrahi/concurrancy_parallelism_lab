# Three replicas behind nginx.
#
# Nothing in the application code changes between this file and docker-compose.yml.
# What changes is that process memory is no longer shared, and that is enough to break
# every strategy whose coordination lives in process memory:
#
#   naive             already broken       (no coordination at all)
#   lock              NOW BROKEN           three replicas, three separate semaphores
#   optimistic        still correct        the token lives in Postgres
#   pessimistic       still correct        the row lock lives in Postgres
#   distributed-lock  still correct        the advisory lock lives in Postgres
#
# Run it:
#   docker compose -f deploy/docker-compose.scale.yml up --build
#   curl -X POST localhost:5080/api/lab/runs -H 'Content-Type: application/json' \
#     -d '{"strategy":"lock","actors":5,"amountEach":100,"startingBalance":100}'
#
# Note the lab drives all actors from within ONE instance, so to see the lock actually
# fail you need concurrent requests spread across replicas — use the k6 script in
# loadtests/k6/hot-account.js, which goes through nginx.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: banklab
      POSTGRES_PASSWORD: banklab
      POSTGRES_DB: banklab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banklab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-1: &api
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      INSTANCE_ID: api-1
      ConnectionStrings__BankDb: "Host=postgres;Port=5432;Database=banklab;Username=banklab;Password=banklab"
    depends_on:
      postgres:
        condition: service_healthy

  api-2:
    <<: *api
    environment:
      INSTANCE_ID: api-2
      ConnectionStrings__BankDb: "Host=postgres;Port=5432;Database=banklab;Username=banklab;Password=banklab"

  api-3:
    <<: *api
    environment:
      INSTANCE_ID: api-3
      ConnectionStrings__BankDb: "Host=postgres;Port=5432;Database=banklab;Username=banklab;Password=banklab"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5080:8080"
    depends_on:
      - api-1
      - api-2
      - api-3
