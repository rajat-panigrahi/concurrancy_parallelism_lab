name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banklab
          POSTGRES_PASSWORD: banklab
          POSTGRES_DB: banklab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      BANKLAB_TEST_DB: "Host=127.0.0.1;Port=5432;Database=banklab_test;Username=banklab;Password=banklab"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/bank-lab-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/bank-lab-ui/package-lock.json

      - name: Install
        run: npm ci

      # The UI holds no business logic, so there is nothing to unit test here — but it
      # can still break the build, and a CI that never compiles it lets it rot.
      - name: Build
        run: npm run build
